# Overlay for load tests: builds the image with the "loadtest" Maven profile (testbench-loadtest-support)
# and runs it with the "loadtest" Spring profile (long-polling push, 30 s session timeout).
#
#   docker compose -f compose.yaml -f compose.loadtest.yaml up --build -d
#
# See README.md, section "Load tests".

services:
  app:
    build:
      args:
        MAVEN_PROFILES: loadtest
    image: sizing-app:loadtest
    environment:
      SPRING_PROFILES_ACTIVE: prod,loadtest
    ports:
      # loadtest:run reads server metrics from the management port during the test
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
