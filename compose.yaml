# The Vaadin application in a container with a memory and CPU limit.
#
#   docker compose up --build -d     # build and start (or loadtest/rebuild.sh, see README.md)
#   docker stats                     # watch CPU and memory usage live
#   docker compose down              # stop
#
# App: http://localhost:8080, Actuator (heap dumps, metrics): http://localhost:8081/actuator
#
# The limits can be changed without editing this file, e.g.:
#
#   APP_MEMORY=512m APP_MAX_RAM_PERCENTAGE=50 docker compose up -d

name: sizing

services:
  app:
    build: .
    image: sizing-app:latest
    container_name: sizing-app
    ports:
      - "${APP_PORT:-8080}:8080"
      # Only reachable from this machine: the heap dump endpoint returns all data in memory
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    environment:
      # Picked up automatically by the java launcher. The heap is sized relative to APP_MEMORY;
      # the rest is needed for metaspace, code cache, thread stacks and GC structures.
      # MarkSweepAlwaysCompactCount=1: every full GC (e.g. of a heap dump) compacts the heap
      # completely. By default, the serial GC, which the JVM picks for small containers, leaves up
      # to 5 % of dead objects in the heap and compacts fully only every 4th time, which adds
      # several MB of noise to the measured heap (see loadtest/measure-session-size.sh).
      JDK_JAVA_OPTIONS: >-
        -XX:MaxRAMPercentage=${APP_MAX_RAM_PERCENTAGE:-75}
        -XX:MarkSweepAlwaysCompactCount=1
        ${APP_JAVA_OPTS:-}
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2.0}"
          memory: ${APP_MEMORY:-1g}
    restart: unless-stopped
