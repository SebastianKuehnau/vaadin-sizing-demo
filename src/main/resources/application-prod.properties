# Production profile (Docker, see compose.yaml): PostgreSQL, configured through environment variables

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sizing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sizing}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sizing}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# The schema is recreated on every start and filled with the same 1000 persons,
# so every load test starts from the same data
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create}
# data.sql uses H2 syntax, so only the PostgreSQL variant is loaded
spring.sql.init.data-locations=classpath:data-postgresql.sql

# Set JPA_SHOW_SQL=true to log every SQL statement
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
