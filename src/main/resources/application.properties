server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,com.flowingcode,org.vaadin.demo.sizing
spring.jpa.defer-datasource-initialization = true
spring.sql.init.mode = always

spring.jpa.show-sql=false

# Actuator on a separate management port, so it can stay internal. It provides the heap dumps and
# the heap and session metrics for the session size measurement (see README.md).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,metrics,heapdump
# Spring Boot disables the heap dump endpoint by default, as a dump contains all data in memory
management.endpoint.heapdump.access=read-only
