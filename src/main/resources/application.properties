server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,com.flowingcode,org.vaadin.demo.sizing
spring.jpa.defer-datasource-initialization = true
spring.sql.init.mode = always

spring.jpa.show-sql=false

# Actuator on a separate management port, so it can stay internal (Prometheus scrapes it)
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=prometheus,vaadin

# Observability Kit: memory held by the component trees and database metrics per route
vaadin.observability.ui-state=true
vaadin.observability.database=true
# Tomcat metrics (threads, sessions) for the dashboard
server.tomcat.mbeanregistry.enabled=true
