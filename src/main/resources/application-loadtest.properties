# Load test profile, activated in addition to prod (see compose.loadtest.yaml and README.md)
# Long-polling push and the 30 s session timeout are set in LoadTestConfiguration.

# loadtest:run of the testbench-converter-plugin reads CPU, heap and session counts
# from the metrics endpoint
management.endpoints.web.exposure.include=health,prometheus,metrics,vaadin

# k6 does not run the JavaScript of the page. The browser metrics collector would only replay the
# samples of the recording, so it is switched off (the recording is made with this profile, too).
vaadin.observability.client=false

# The k6 converter replays long-polling push requests with the push ID of the recording, which the
# server rejects with one warning per request. Push is not used for UI updates, so the requests
# only add noise; keep them out of the log.
logging.level.com.vaadin.flow.server.communication.PushHandler=error
