# Scrapes the application's Actuator endpoint on the management port (see application.properties).
# k6 pushes its client-side metrics via remote write (see loadtest/k6-prometheus.sh), so it needs
# no scrape job.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: sizing-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]
